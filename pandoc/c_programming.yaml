toc: true
number-sections: true

pdf-engine: xelatex
highlight-style: tango

include-in-header:
  - pandoc/latex/head.tex

filters:
  - filters/number-code-lines.lua

variables:
  geometry:
    - margin=1in
    - bottom=1in
    - left=1in
    - right=1in
  papersize: a4
  colorlinks: true
  linkcolor: blue
  urlcolor: cyan
  fontsize: 10pt
  documentclass: article
  classoption: a4paper
  parskip: half
  tables: true

metadata:
  title: C Programming Book
  author: Mohan Arunachalam
